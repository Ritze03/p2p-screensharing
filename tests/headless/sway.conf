# Private headless sway for the e2e suite (see run.sh). No input devices, one virtual 1920x1080 output.
xwayland enable
output HEADLESS-1 mode 1920x1080@60Hz
default_border none
default_floating_border none
# tell run.sh which X display Xwayland got
exec sh -c 'echo $DISPLAY > $XDG_RUNTIME_DIR/display'
